name: cloudflare-edge
on:
  push:
    branches: [main]
    paths: ["cloudflare/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Set CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, Workers KV Storage:Edit)
    # and CLOUDFLARE_ACCOUNT_ID as repository secrets to enable this job.
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke
        run: |
          URL=$(npx wrangler deployments list --json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('url','') if d else '')" || true)
          echo "deployed: ${URL:-see wrangler output}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
