[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timesfm3"
version = "0.1.0"
description = "Independent PyTorch implementation of TimesFM-3, a zero-shot foundation model for multivariate time-series forecasting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.4",
    "numpy>=1.24",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["timesfm3*"]
